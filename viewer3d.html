<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דירת גבעתיים - מודל תלת-ממד אינטראקטיבי להורים</title>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a1a; color: #fff; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    #ui-overlay { position: absolute; top: 16px; right: 16px; background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(8px); padding: 16px 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); max-width: 340px; border: 1px solid rgba(255,255,255,0.1); }
    h2 { margin: 0 0 8px 0; font-size: 18px; font-weight: 600; color: #f5f5f5; }
    p { margin: 0 0 12px 0; font-size: 13px; color: #aaa; line-height: 1.4; }
    .control-group { margin-bottom: 12px; }
    .label { font-size: 12px; font-weight: 600; text-transform: uppercase; color: #888; margin-bottom: 6px; display: block; }
    .btn-group { display: flex; gap: 6px; }
    button { flex: 1; padding: 8px 12px; border: 1px solid #444; background: #2a2a2a; color: #eee; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
    button.active { background: #3b82f6; border-color: #3b82f6; color: #fff; font-weight: bold; }
    button:hover { background: #333; }
    button.active:hover { background: #2563eb; }
    #instructions { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px; font-size: 12px; color: #ccc; pointer-events: none; }
  </style>
  <script src="./three.min.js"></script>
  <script src="./OrbitControls.js"></script>

  <script>
    window.addEventListener('error', function(e) {
      const errBox = document.getElementById('instructions');
      if (errBox) {
        errBox.innerHTML = '<span style="color: #ef4444; font-weight: bold;">שגיאת טעינה: ' + e.message + '</span>';
      }
    });
  </script>

</head>
<body>
  <div id="canvas-container"></div>
  <div id="ui-overlay">
    <h2>דירת ערבי הנחל 5 - גבעתיים</h2>
    <p>מודל תלת-ממד אינטראקטיבי נעול על תוכנית הבניין של אבא (ניתן לסובב, להתקרב ולהחליף תצורות בלחיצה).</p>
    
    <div class="control-group">
      <span class="label">תצורת מטבח:</span>
      <div class="btn-group">
        <button id="btn-kitchen-u" class="active" onclick="setKitchen('u')">מצב א': מטבח ח' (קבלני)</button>
        <button id="btn-kitchen-island" onclick="setKitchen('island')">מצב ב': מטבח ר' + אי</button>
      </div>
    </div>

    <div class="control-group">
      <span class="label">ריצוף וחיפוי:</span>
      <div class="btn-group">
        <button id="btn-floor-parquet" class="active" onclick="setFloor('parquet')">פרקט אלון SPC</button>
        <button id="btn-floor-tile" onclick="setFloor('tile')">גרניט פורצלן בהיר</button>
      </div>
    </div>

    <div class="control-group">
      <span class="label">מבטי מצלמה:</span>
      <div class="btn-group">
        <button onclick="setCamera('top')">מבט על</button>
        <button onclick="setCamera('living')">סלון ומטבח</button>
        <button onclick="setCamera('balcony')">מרפסת</button>
      </div>
    </div>
  </div>

  <div id="instructions">גרור עם העכבר/אצבע לסיבוב | גלגלת לזום | לחצן ימני להזזה</div>

  <script>
    let scene, camera, renderer, controls;
    let kitchenUGroup, kitchenIslandGroup, floorMesh;
    
    const colors = {
      wall: 0xe5e7eb,
      wallInner: 0xf3f4f6,
      parquet: 0xd4a373,
      porcelain: 0xf0efe9,
      cabinet: 0xd6c7b2,
      countertop: 0xffffff,
      sofa: 0x9ca3af,
      glass: 0x93c5fd,
      woodDark: 0x8b5a2b
    };

    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x18181b);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 14, 18);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2.05;

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xfff7ed, 0.85);
      dirLight.position.set(-10, 15, -5); // Sunlight from West/Balcony
      dirLight.castShadow = true;
      scene.add(dirLight);

      buildApartment();

      window.addEventListener('resize', onWindowResize, false);
      animate();
    }

    function createWall(x, z, width, length, height=2.7) {
      const geo = new THREE.BoxGeometry(width, height, length);
      const mat = new THREE.MeshStandardMaterial({ color: colors.wall, roughness: 0.9 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, height / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function buildApartment() {
      // Floor (10m x 8m approx)
      const floorGeo = new THREE.PlaneGeometry(12, 10);
      const floorMat = new THREE.MeshStandardMaterial({ color: colors.parquet, roughness: 0.6 });
      floorMesh = new THREE.Mesh(floorGeo, floorMat);
      floorMesh.rotation.x = -Math.PI / 2;
      floorMesh.receiveShadow = true;
      scene.add(floorMesh);

      // Living Room North Wall (TV wall)
      createWall(0, -4, 8, 0.2);
      // South Wall (Back of living room + pantry wall)
      createWall(0, 2, 8, 0.2);
      // East Wall (Back of kitchen & entrance)
      createWall(4, -1, 0.2, 6);

      // West Balcony Vitrina (Glass & Frame)
      const glassGeo = new THREE.BoxGeometry(0.05, 2.7, 5.2);
      const glassMat = new THREE.MeshPhysicalMaterial({ color: colors.glass, transparent: true, opacity: 0.35, roughness: 0.1 });
      const glass = new THREE.Mesh(glassGeo, glassMat);
      glass.position.set(-4, 1.35, -1);
      scene.add(glass);

      // Balcony Floor
      const balcGeo = new THREE.PlaneGeometry(3.8, 5.2);
      const balcMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, roughness: 0.8 });
      const balcMesh = new THREE.Mesh(balcGeo, balcMat);
      balcMesh.rotation.x = -Math.PI / 2;
      balcMesh.position.set(-5.9, 0.01, -1);
      scene.add(balcMesh);

      // Balcony Glass Railing
      const railGeo = new THREE.BoxGeometry(0.05, 1.1, 5.2);
      const railMesh = new THREE.Mesh(railGeo, glassMat);
      railMesh.position.set(-7.8, 0.55, -1);
      scene.add(railMesh);

      // Living Room Sofa (South wall)
      const sofaGeo = new THREE.BoxGeometry(1.0, 0.8, 2.8);
      const sofaMat = new THREE.MeshStandardMaterial({ color: colors.sofa, roughness: 0.8 });
      const sofa = new THREE.Mesh(sofaGeo, sofaMat);
      sofa.position.set(-1.8, 0.4, 1.4);
      scene.add(sofa);

      // Coffee table
      const tableGeo = new THREE.BoxGeometry(0.6, 0.35, 1.2);
      const tableMat = new THREE.MeshStandardMaterial({ color: colors.woodDark, roughness: 0.5 });
      const table = new THREE.Mesh(tableGeo, tableMat);
      table.position.set(-1.8, 0.18, 0.1);
      scene.add(table);

      // TV Media Console (North wall)
      const tvGeo = new THREE.BoxGeometry(0.4, 0.45, 2.4);
      const tv = new THREE.Mesh(tvGeo, tableMat);
      tv.position.set(-1.8, 0.23, -3.7);
      scene.add(tv);

      // --- Kitchen Group: U-Shape (State A) ---
      kitchenUGroup = new THREE.Group();
      
      // Tall cabinetry run (East wall)
      const tallGeo = new THREE.BoxGeometry(0.65, 2.7, 3.2);
      const tallMat = new THREE.MeshStandardMaterial({ color: colors.cabinet, roughness: 0.7 });
      const tallMesh = new THREE.Mesh(tallGeo, tallMat);
      tallMesh.position.set(3.6, 1.35, -2.2);
      kitchenUGroup.add(tallMesh);

      // Back Counter & Sink (North wall)
      const backGeo = new THREE.BoxGeometry(2.4, 0.9, 0.65);
      const counterMat = new THREE.MeshStandardMaterial({ color: colors.countertop, roughness: 0.3 });
      const backMesh = new THREE.Mesh(backGeo, counterMat);
      backMesh.position.set(2.2, 0.45, -3.6);
      kitchenUGroup.add(backMesh);

      // Peninsula attached counter (U third arm)
      const penGeo = new THREE.BoxGeometry(0.8, 0.9, 2.2);
      const penMesh = new THREE.Mesh(penGeo, counterMat);
      penMesh.position.set(1.0, 0.45, -2.3);
      kitchenUGroup.add(penMesh);

      // Stools at peninsula
      for (let i = 0; i < 3; i++) {
        const stoolGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.65);
        const stoolMat = new THREE.MeshStandardMaterial({ color: 0x333 });
        const stool = new THREE.Mesh(stoolGeo, stoolMat);
        stool.position.set(0.3, 0.33, -3.0 + i * 0.7);
        kitchenUGroup.add(stool);
      }
      scene.add(kitchenUGroup);

      // --- Kitchen Group: Island (State B) ---
      kitchenIslandGroup = new THREE.Group();
      
      // Same Tall cabinetry run & Back Counter
      const tallMeshB = tallMesh.clone();
      kitchenIslandGroup.add(tallMeshB);
      const backMeshB = backMesh.clone();
      kitchenIslandGroup.add(backMeshB);

      // Freestanding Island (2.2m x 0.85m) with 100cm walkways all around
      const islandGeo = new THREE.BoxGeometry(0.85, 0.9, 2.2);
      const islandMesh = new THREE.Mesh(islandGeo, counterMat);
      islandMesh.position.set(1.6, 0.45, -1.8);
      kitchenIslandGroup.add(islandMesh);

      // Stools on outer island side
      for (let i = 0; i < 3; i++) {
        const stoolGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.65);
        const stoolMat = new THREE.MeshStandardMaterial({ color: 0x333 });
        const stool = new THREE.Mesh(stoolGeo, stoolMat);
        stool.position.set(0.9, 0.33, -2.5 + i * 0.7);
        kitchenIslandGroup.add(stool);
      }
      kitchenIslandGroup.visible = false;
      scene.add(kitchenIslandGroup);
    }

    function setKitchen(mode) {
      document.getElementById('btn-kitchen-u').classList.toggle('active', mode === 'u');
      document.getElementById('btn-kitchen-island').classList.toggle('active', mode === 'island');
      kitchenUGroup.visible = (mode === 'u');
      kitchenIslandGroup.visible = (mode === 'island');
    }

    function setFloor(mode) {
      document.getElementById('btn-floor-parquet').classList.toggle('active', mode === 'parquet');
      document.getElementById('btn-floor-tile').classList.toggle('active', mode === 'tile');
      floorMesh.material.color.setHex(mode === 'parquet' ? colors.parquet : colors.porcelain);
    }

    function setCamera(view) {
      if (view === 'top') {
        camera.position.set(0, 16, 0.1);
        controls.target.set(0, 0, -1);
      } else if (view === 'living') {
        camera.position.set(-3.5, 1.6, -1);
        controls.target.set(2, 1.2, -2);
      } else if (view === 'balcony') {
        camera.position.set(-6, 2, -1);
        controls.target.set(0, 1.2, -1);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
